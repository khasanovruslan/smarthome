<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ЖК «Резиденция»</title>
<style>
  :root{
    --bg:#f2f3f5; --surface:#ffffff; --surface-2:#f6f7f8; --ink:#15171a; --muted:#73777f;
    --line:#e8eaed; --accent:#2f6df6; --accent-2:#eaf0ff; --success:#1e9b61; --danger:#e05252; --warning:#c57d17; --danger-2:#fff1f1;
    --shadow:0 20px 60px rgba(25,32,45,.16); --card-shadow:0 7px 20px rgba(30,36,48,.07);
    --r-xl:28px; --r-lg:22px; --r-md:18px; --r-sm:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg)}
  body{overflow:hidden}
  button,input,textarea,select{font:inherit}
  button{border:0; cursor:pointer}
  .stage{height:100%; display:grid; place-items:center; position:relative; overflow:hidden; background:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.95), transparent 26%),
    radial-gradient(circle at 82% 88%, rgba(222,228,238,.6), transparent 30%), #eef0f3;}
  .stage:before{content:""; position:absolute; width:680px; height:680px; border-radius:50%; background:rgba(255,255,255,.44); filter:blur(70px); top:-360px; right:-250px; pointer-events:none}
  .demo-tools{position:absolute; right:28px; bottom:26px; display:flex; gap:10px; z-index:20; flex-wrap:wrap; justify-content:flex-end}
  .demo-btn{background:rgba(255,255,255,.86); color:#353a43; border:1px solid rgba(255,255,255,.9); backdrop-filter:blur(12px); padding:11px 15px; border-radius:999px; box-shadow:0 6px 24px rgba(30,34,44,.10); font-size:13px; font-weight:700; transition:.2s ease}
  .demo-btn:hover{transform:translateY(-1px); background:#fff}

  .phone-wrap{width:418px; height:850px; position:relative; perspective:none; transform-origin:center center}
  .phone{width:100%; height:100%; border-radius:52px; background:linear-gradient(145deg,#202226,#0f1114 60%,#2b2e34); padding:9px; box-shadow:0 32px 80px rgba(23,28,38,.25), inset 0 0 0 1px rgba(255,255,255,.11); position:relative; transform-style:flat; transition:none; transform:none !important}
  .phone:before,.phone:after{content:""; position:absolute; width:4px; background:#24272c; border-radius:5px; left:-4px}
  .phone:before{height:92px; top:170px}.phone:after{height:62px; top:285px}
  .power{position:absolute; right:-4px; width:4px; height:114px; top:220px; background:#24272c; border-radius:5px}
  .screen{height:100%; width:100%; background:var(--surface-2); border-radius:44px; overflow:hidden; position:relative; isolation:isolate; box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
  .statusbar{height:34px; padding:11px 20px 0; display:flex; align-items:flex-start; justify-content:space-between; position:absolute; inset:0 0 auto; z-index:50; pointer-events:none; color:#141619; font-size:12px; font-weight:800}
  .status-icons{display:flex; align-items:center; gap:6px}
  .status-icons span{display:inline-block}
  .signal{width:14px;height:10px;background:linear-gradient(to top, #111 0 100%); clip-path:polygon(0 100%,0 72%,18% 72%,18% 55%,40% 55%,40% 35%,62% 35%,62% 15%,84% 15%,84% 0,100% 0,100% 100%)}
  .wifi{position:relative;width:16px;height:11px;background:radial-gradient(circle at 50% 100%, #111 0 1.4px, transparent 1.6px)}.wifi:before,.wifi:after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:1.8px solid #111;border-left-color:transparent;border-right-color:transparent;border-bottom:none;border-radius:50%}.wifi:before{width:14px;height:7px;top:0}.wifi:after{width:8px;height:4px;top:4px}
  .battery{width:20px;height:9px;border:1.7px solid #111;border-radius:3px;position:relative}.battery:before{content:"";position:absolute;inset:1px;background:#111;border-radius:1px}.battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:#111;border-radius:0 2px 2px 0}
  .island{position:absolute; width:118px; height:31px; border-radius:18px; background:#08090a; left:50%; top:9px; transform:translateX(-50%); z-index:60; box-shadow:inset 0 1px rgba(255,255,255,.04)}

  #app{height:100%; position:relative; overflow:hidden}
  .app-page{height:100%; width:100%; display:flex; flex-direction:column; overflow:hidden; min-width:0}
  @keyframes pageIn{from{opacity:1; transform:none}to{opacity:1; transform:none}}
  .top-space{height:46px; flex:0 0 46px}
  .scroll{overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; padding:0 17px 104px; scrollbar-width:none; scrollbar-gutter:stable; flex:1; min-width:0}
  .scroll::-webkit-scrollbar,.topics::-webkit-scrollbar,.messages::-webkit-scrollbar,.date-strip::-webkit-scrollbar{display:none}
  .page-title{font-size:29px; line-height:1.08; margin:12px 0 5px; letter-spacing:-.7px}
  .eyebrow{font-size:13px; color:var(--muted); font-weight:650}
  .section{margin-top:22px}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .section-title{font-size:17px; font-weight:800; letter-spacing:-.25px}
  .link-btn{background:transparent;color:var(--accent);font-size:13px;font-weight:750;padding:6px}
  .card{background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--card-shadow); border:1px solid rgba(232,234,237,.72)}
  .press{transition:background-color .14s ease, box-shadow .14s ease, border-color .14s ease}.press:active{box-shadow:0 2px 10px rgba(30,36,48,.06); background-color:#fbfcfd}
  .muted{color:var(--muted)}
  .mini{font-size:12px}
  .tag{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border-radius:999px;background:#f1f3f6;color:#50555e;font-size:11px;font-weight:800}
  .tag.live{background:#fff0f0;color:#c43e3e}.tag.success{background:#eaf7f1;color:#178352}

  .header-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#d9e4ff,#f5d5ca);display:grid;place-items:center;font-weight:850;color:#405174}
  .hello{font-size:13px;color:var(--muted);font-weight:650}.resident{font-size:27px;font-weight:850;letter-spacing:-.65px;margin-top:2px}

  .quick-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .quick{padding:15px 9px 13px; text-align:center; min-height:112px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--ink)}
  .icon-wrap{width:44px;height:44px;border-radius:15px;background:var(--accent-2);color:var(--accent);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(47,109,246,.05)}
  .icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .quick strong{font-size:13px}.quick .state{font-size:11px;color:var(--muted);height:14px}
  .quick.opened .icon-wrap{background:#e6f5ee;color:var(--success)}.quick.opened .state{color:var(--success);font-weight:800}

  .notice-card{padding:18px 18px 17px;text-align:left}.notice-card.important{border-left:4px solid var(--danger);background:linear-gradient(180deg,#fff,#fff9f9)}.notice-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.alert-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--danger-2);color:var(--danger);font-size:11px;font-weight:900;letter-spacing:.02em}.alert-pill .bang{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--danger);color:#fff;font-size:11px;line-height:1}.notice-date{font-size:11px;color:#8d939c;font-weight:800;letter-spacing:.02em}.notice-card h3{margin:0 0 6px;font-size:17px;letter-spacing:-.2px}.notice-card p{font-size:13px;line-height:1.45;margin:0;color:#5d626b}.notice-note{margin-top:10px;font-size:11px;color:#7b8088}
  .bill-card{padding:16px;display:flex;flex-direction:column;gap:13px;background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid #dce6fa;box-shadow:0 10px 24px rgba(47,109,246,.08)}.bill-top{display:flex;align-items:center;justify-content:space-between;gap:14px}.bill-title-wrap{display:flex;gap:12px;align-items:center;min-width:0}.bill-card .bill-icon{width:44px;height:44px;border-radius:15px;background:#eef3ff;display:grid;place-items:center;color:var(--accent);flex:0 0 44px}.bill-main{display:flex;flex-direction:column;gap:5px;min-width:0}.bill-main strong{display:block;font-size:16px;letter-spacing:-.2px;line-height:1.15}.bill-main .mini{line-height:1.35}.bill-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}.amount{font-weight:900;font-size:25px;letter-spacing:-.65px;line-height:1}.amount-caption{font-size:10.5px;color:#7e8793;font-weight:800}.bill-actions{display:flex;gap:12px;align-items:center;padding-top:12px;border-top:1px solid #e8edf5}.bill-actions .action-sm{min-width:108px}.action-sm{background:var(--accent);color:#fff;padding:11px 14px;border-radius:13px;font-size:12px;font-weight:850;min-width:120px;text-align:center;transition:filter .15s ease}.action-sm:active{filter:brightness(.96)}.action-sm.secondary{background:#f0f2f5;color:#333943}.bill-link{background:transparent;color:#516079;font-size:12px;font-weight:800;padding:8px 4px;text-align:left;display:inline-flex;align-items:center;gap:2px}.bill-link .chev{width:14px;height:14px}.bill-account{margin-top:13px;padding-top:13px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:700}

  .bottom-nav{position:absolute;z-index:40;left:10px;right:10px;bottom:10px;height:72px;border-radius:24px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid rgba(230,232,235,.9);box-shadow:0 10px 32px rgba(28,34,42,.10);display:flex;align-items:center;justify-content:space-around;padding:7px 4px 5px}
  .nav-item{width:20%;background:transparent;color:#8b9097;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:750}.nav-item .icon{width:21px;height:21px}.nav-item.active{color:var(--accent)}

  .sub-header{height:91px;padding:48px 15px 10px;display:flex;align-items:center;gap:10px;flex:0 0 91px;background:rgba(246,247,248,.9);backdrop-filter:blur(12px);position:relative;z-index:20;min-width:0}.back{width:36px;height:36px;border-radius:13px;background:#fff;display:grid;place-items:center;color:#343941;box-shadow:0 3px 12px rgba(32,38,46,.06);flex:0 0 36px}.sub-title{font-size:18px;font-weight:850;letter-spacing:-.25px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right-action{font-size:12px;font-weight:800;color:var(--accent);background:transparent;flex:0 0 auto}

  .call-content{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:54px 22px 28px}.call-head{text-align:center}.call-head .tiny{font-size:12px;color:#d7dde3}.call-head h2{font-size:26px;margin:5px 0}.call-head p{margin:0;color:#d0d6dc;font-size:12px}.call-spacer{flex:1}.call-status{text-align:center;min-height:48px;font-weight:900}.call-actions{display:flex;justify-content:space-around;align-items:center}.call-btn{display:flex;flex-direction:column;align-items:center;gap:7px;background:transparent;color:#fff;font-size:10px;font-weight:800}.call-circle{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);backdrop-filter:blur(10px)}.call-circle.green{background:#2ba66d}.call-circle.red{background:#dc5157}.call-circle.blue{background:#2f6df6}.call-circle .icon{width:28px;height:28px;stroke-width:2.1}

  .camera-view{background:#10151a;color:#fff}.camera-live{height:330px;position:relative;overflow:hidden;background:#2b343b}.camera-live .camera-scene{inset:-30px}.live-hud{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.36),transparent 42%,rgba(0,0,0,.5))}.live-hud-top,.live-hud-bottom{display:flex;justify-content:space-between;align-items:center}.live-hud strong{font-size:18px}.camera-actions{padding:14px 0 2px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.camera-action{padding:13px 6px;border-radius:14px;background:#fff;color:#333941;font-size:11px;font-weight:850}.camera-list-dark{padding-top:8px;display:grid;gap:8px}.camera-item-dark{background:#1b2229;border:1px solid #28313a;padding:14px;border-radius:16px;color:#fff;display:flex;justify-content:space-between;align-items:center}.camera-item-dark span{font-size:12px;color:#aab2b9}.camera-item-dark strong{font-size:13px}

  .toast{position:absolute;z-index:120;left:50%;bottom:98px;transform:translateX(-50%);background:rgba(26,30,35,.94);color:#fff;padding:11px 14px;border-radius:14px;font-size:12px;font-weight:800;box-shadow:0 10px 28px rgba(18,22,28,.22);animation:toastIn .25s ease both;white-space:nowrap}@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .startup-fallback{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--surface-2)}.startup-fallback-card{max-width:290px;padding:24px;border-radius:22px;background:#fff;box-shadow:var(--card-shadow)}.startup-fallback h1{margin:0 0 9px;font-size:22px}.startup-fallback p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}

  @media (max-height:900px){.phone-wrap{transform:scale(.88)}}
  @media (max-height:780px){.phone-wrap{transform:scale(.75)}}
  @media (max-height:680px){.phone-wrap{transform:scale(.64)}}
  @media (max-width:760px){.demo-tools{right:14px;bottom:14px}.demo-btn{padding:9px 11px;font-size:11px}.phone-wrap{transform:scale(.88)}}
  @media (max-width:450px){body{background:#111}.stage{background:#111}.phone-wrap{width:100vw;height:100vh;transform:none!important}.phone{padding:0;border-radius:0}.screen{border-radius:0}.phone:before,.phone:after,.power{display:none}.demo-tools{display:none}}

  /* Presentation capture: a single long mobile page without the device chrome. */
  html.capture,html.capture body{width:418px;height:auto;min-height:100%;background:var(--surface-2)}
  html.capture body{overflow:visible}
  html.capture .stage{display:block;width:418px;height:auto;min-height:0;overflow:visible;background:var(--surface-2)}
  html.capture .stage:before,html.capture .demo-tools,html.capture .phone:before,html.capture .phone:after,html.capture .power,html.capture .island{display:none}
  html.capture .phone-wrap{width:418px;height:auto;margin:0;transform:none!important}
  html.capture .phone{height:auto;padding:0;border-radius:0;background:transparent;box-shadow:none}
  html.capture .screen{height:auto;border-radius:0;overflow:visible;box-shadow:none}
  html.capture #app,html.capture .app-page{height:auto;min-height:0;overflow:visible}
  html.capture .scroll{height:auto;flex:none;overflow:visible;padding:0 17px 20px}
  html.capture .bottom-nav{position:relative;left:auto;right:auto;bottom:auto;flex:0 0 72px;margin:0 10px 10px}
  @media (max-width:418px){html.capture,html.capture body,html.capture .stage,html.capture .phone-wrap{width:100%}}

function rootLayout(content, active){
 return `<div class="app-page"><div class="top-space"></div><div class="scroll">${content}</div>${bottomNav(active)}</div>`;
}
function bottomNav(active){
 const items=[['home','home','Главная'],['access','key','Доступ'],['house','building','Дом'],['chats','chat','Чаты'],['profile','user','Профиль']];
 return `<nav class="bottom-nav">${items.map(([r,i,l])=>`<button class="nav-item ${active===r?'active':''}" onclick="go('${r}')">${icon(i)}<span>${l}</span></button>`).join('')}</nav>`
}
function subLayout(title,content, options={}){
 return `<div class="app-page ${options.dark?'camera-view':''}"><div class="sub-header" style="${options.dark?'background:#10151a;color:white':''}"><button class="back" onclick="back()" style="${options.dark?'background:#1b2229;color:white':''}">${icon('back')}</button><div class="sub-title">${title}</div>${options.right?`<button class="right-action" onclick="${options.right.on}">${options.right.label}</button>`:''}</div><div class="scroll" style="${options.dark?'background:#10151a':''}">${content}</div></div>`;
}
function go(route){state.previous=state.route; state.route=route; render();}

}

function sendMessage(e){e.preventDefault();const input=document.getElementById('msgInput');const text=input.value.trim();if(!text)return;(state.messages[state.topic]||(state.messages[state.topic]=[])).push({me:true,who:'Анна',text,time:nowTime()});input.value='';render();setTimeout(scrollMessages,30)}
function scrollMessages(){const el=document.getElementById('messages');if(el)el.scrollTop=el.scrollHeight}

function profileView(){const rows=[['building','Моя квартира','Квартира, лицевой счёт и доступ','apartment'],['users','Жители квартиры','Кто имеет доступ к приложению','residents'],['car','Автомобили','Машины для въезда через шлагбаум','cars'],['bell','Уведомления','Новости, квитанции и домофон','notifications'],['shield','Безопасность','Гостевой доступ и подтверждение действий','security'],['settings','Настройки','Поддержка и параметры приложения','settings']];return rootLayout(`<div class="page-title">Профиль</div><section class="section"><div class="profile-hero card"><div class="profile-avatar">АС</div><div><h3>Анна Смирнова</h3><p>ЖК «Резиденция»<br>Дом 2 · Подъезд 1 · Квартира 74</p></div></div><div class="settings card">${rows.map(r=>`<button class="setting-row" style="width:100%" onclick="openProfileSection('${r[3]}')"><div class="icon-wrap">${icon(r[0])}</div><div style="flex:1;text-align:left"><strong>${r[1]}</strong><small>${r[2]}</small></div>${icon('chev','chev')}</button>`).join('')}</div></section>`,'profile')}

function requestsView(){return subLayout('Обращения',`<button class="primary" style="margin-bottom:12px" onclick="requestModal()">Создать обращение</button><div class="request-list">${state.requests.newCreated?`<button class="request-card card press" onclick="openRequest('new')"><div class="icon-wrap">${icon('wrench')}</div><div class="request-main"><strong>Протечка под раковиной</strong><p>Создано только что · заявка передана диспетчеру</p></div><div class="request-side"><span class="request-status">Принято</span>${icon('chev','chev')}</div></button>`:''}<button class="request-card card press" onclick="openRequest('water')"><div class="icon-wrap">${icon('wrench')}</div><div class="request-main"><strong>Слабый напор воды в ванной</strong><p>Сегодня · специалист назначен на 16:00–18:00</p></div><div class="request-side"><span class="request-status progress">В работе</span>${icon('chev','chev')}</div></button><button class="request-card card press" onclick="openRequest('lamp')"><div class="icon-wrap">${icon('check')}</div><div class="request-main"><strong>Замена лампы на этаже</strong><p>13 сентября · работы завершены</p></div><div class="request-side"><span class="request-status done">Решено</span>${icon('chev','chev')}</div></button></div>`) }
function requestModal(){showModal(`<div class="grabber"></div><h2>Новое обращение</h2><p>Опишите проблему — заявка сразу попадёт в управляющую компанию.</p><div class="field"><label>Категория</label><select id="requestCategory"><option>Сантехника</option><option>Электрика</option><option>Лифт</option><option>Уборка и территория</option><option>Другое</option></select></div><div class="field"><label>Что случилось</label><textarea id="requestText">Протекает соединение под раковиной на кухне.</textarea></div><button class="request-form-photo" style="width:100%;text-align:left" onclick="event.stopPropagation();showToast('Фото добавлено')"><div class="icon-wrap">${icon('camera')}</div><div><strong>Добавить фото</strong><span>Поможет специалисту быстрее понять проблему</span></div></button><div class="sheet-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="confirm" onclick="submitRequest()">Отправить</button></div>`)}
function submitRequest(){showModal(`<div class="grabber"></div><div class="center"><div class="spinner"></div><h2>Отправляем обращение…</h2></div>`);setTimeout(()=>{state.requests.newCreated=true;showModal(`<div class="grabber"></div><div class="center"><div class="success-mark">${icon('check')}</div><h2>Обращение принято</h2><p>Управляющая компания получила заявку. Статус можно отслеживать в приложении.</p><button class="primary success" onclick="closeModal();render()">Готово</button></div>`);},800)}
function openRequest(id){state.requests.current=id;state.previous='requests';state.route='requestDetail';render()}
function requestDetailView(){const id=state.requests.current;if(id==='lamp')return subLayout('Обращение',`<div class="request-detail-head card"><span class="request-status done">Решено</span><h2>Замена лампы на этаже</h2><p>Освещение у лифта на 7 этаже восстановлено.</p><div class="request-meta"><span class="request-chip">№ 1842</span><span class="request-chip">13 сентября</span></div></div><section class="section"><div class="request-timeline card">${timeline('Заявка принята','13 сентября · 09:14','done')}${timeline('Специалист назначен','13 сентября · 10:05','done')}${timeline('Работы выполнены','13 сентября · 12:31','done')}</div></section>`);if(id==='new')return subLayout('Обращение',`<div class="request-detail-head card"><span class="request-status">Принято</span><h2>Протечка под раковиной</h2><p>Протекает соединение под раковиной на кухне.</p><div class="request-meta"><span class="request-chip">Сантехника</span><span class="request-chip">Создано сегодня</span></div></div><section class="section"><div class="request-timeline card">${timeline('Заявка принята','Только что · диспетчер получил обращение','active')}${timeline('Специалист назначен','Ожидаем назначения','')}${timeline('Работы выполнены','После визита специалиста','')}</div></section>`);return subLayout('Обращение',`<div class="request-detail-head card"><span class="request-status progress">В работе</span><h2>Слабый напор воды в ванной</h2><p>Напор холодной воды заметно слабее обычного. Проблема сохраняется второй день.</p><div class="request-meta"><span class="request-chip">Сантехника</span><span class="request-chip">№ 1867</span></div></div><section class="section"><div class="request-timeline card">${timeline('Заявка принята','Сегодня · 10:12','done')}${timeline('Специалист назначен','Сегодня · визит с 16:00 до 18:00','active')}${timeline('Работы выполнены','Статус обновится после визита','')}</div></section><section class="section"><button class="primary ghost" onclick="showToast('Чат с диспетчером открыт')">Написать диспетчеру</button></section>`)}
function timeline(title,sub,status){return `<div class="timeline-row ${status}"><div class="timeline-dot">${status==='done'?'✓':status==='active'?'•':''}</div><div class="timeline-copy"><strong>${title}</strong><span>${sub}</span></div></div>`}

function openProfileSection(section){state.profileSection=section;state.previous='profile';state.route='profileDetail';render()}
function togglePref(group,key){state[group][key]=!state[group][key];render()}
function profileDetailView(){
 const section=state.profileSection;
 const views={
  apartment:{title:'Моя квартира',content:`<div class="detail-list"><div class="detail-card card"><h3>Квартира 74</h3><p>Дом 2 · Подъезд 1 · ЖК «Резиденция»</p></div><div class="card detail-card"><div class="detail-row"><div class="detail-copy"><strong>Лицевой счёт</strong><span>№ 4587321 · используется для квитанций и услуг</span></div><div class="detail-pill">Активен</div></div><div class="detail-row"><div class="detail-copy"><strong>Домофон и доступ</strong><span>1 основной смартфон, 2 электронных ключа</span></div></div><div class="detail-row"><div class="detail-copy"><strong>Счётчики</strong><span>Холодная вода, горячая вода, электричество</span></div></div></div></div>`},
  residents:{title:'Жители квартиры',content:`<div class="detail-list"><div class="card detail-card"><div class="detail-row"><div class="detail-copy"><strong>Анна Смирнова</strong><span>Основной пользователь · полный доступ</span></div><div class="detail-pill">Владелец</div></div><div class="detail-row"><div class="detail-copy"><strong>Илья Смирнов</strong><span>Доступ к домофону, шлагбауму и чатам</span></div><div class="detail-pill">Житель</div></div></div><button class="primary ghost" onclick="showToast('Добавление жителя показано в полной версии')">Пригласить жителя</button></div>`},
  cars:{title:'Автомобили',content:`<div class="detail-list"><div class="card detail-card"><div class="detail-row"><div class="detail-copy"><strong>Toyota RAV4 · А123ВС 159</strong><span>Доступ на шлагбаум и гостевую парковку активен</span></div><div class="detail-pill">Основной</div></div><div class="detail-row"><div class="detail-copy"><strong>Гостевой пропуск для переезда</strong><span>Не создан · можно оформить в разделе «Услуги»</span></div></div></div><button class="primary ghost" onclick="showToast('Добавление автомобиля доступно в полной версии')">Добавить автомобиль</button></div>`},
  notifications:{title:'Уведомления',content:`<div class="detail-list"><div class="card detail-card"><div class="switch-row"><div class="switch-copy"><strong>Новости управляющей компании</strong><span>Объявления и важные сообщения</span></div><button class="switch ${state.notificationPrefs.news?'active':''}" onclick="togglePref('notificationPrefs','news')"><span class="switch-thumb"></span></button></div><div class="switch-row"><div class="switch-copy"><strong>Квитанции и счета</strong><span>Появление новой квитанции и статусы оплаты</span></div><button class="switch ${state.notificationPrefs.bills?'active':''}" onclick="togglePref('notificationPrefs','bills')"><span class="switch-thumb"></span></button></div><div class="switch-row"><div class="switch-copy"><strong>Домовые чаты</strong><span>Новые ответы и упоминания</span></div><button class="switch ${state.notificationPrefs.chats?'active':''}" onclick="togglePref('notificationPrefs','chats')"><span class="switch-thumb"></span></button></div><div class="switch-row"><div class="switch-copy"><strong>Домофонные вызовы</strong><span>Входящие звонки и видеовызов</span></div><button class="switch ${state.notificationPrefs.intercom?'active':''}" onclick="togglePref('notificationPrefs','intercom')"><span class="switch-thumb"></span></button></div></div></div>`},
  security:{title:'Безопасность',content:`<div class="detail-list"><div class="card detail-card"><div class="detail-row"><div class="detail-copy"><strong>Последний вход</strong><span>Сегодня, ${nowTime()} · iPhone Анны</span></div><div class="detail-pill">Безопасно</div></div><div class="detail-row"><div class="detail-copy"><strong>Гостевые пропуска</strong><span>${state.guest ? '1 активный' : 'Нет активных'}</span></div><button class="action-sm secondary" onclick="guestModal()">Создать</button></div></div><div class="card detail-card"><div class="switch-row"><div class="switch-copy"><strong>Подтверждение при открытии шлагбаума</strong><span>Защита от случайного нажатия</span></div><button class="switch ${state.securityPrefs.confirmBarrier?'active':''}" onclick="togglePref('securityPrefs','confirmBarrier')"><span class="switch-thumb"></span></button></div><div class="switch-row"><div class="switch-copy"><strong>Показывать превью видеозвонка</strong><span>Видео сразу отображается на экране вызова</span></div><button class="switch ${state.securityPrefs.callPreview?'active':''}" onclick="togglePref('securityPrefs','callPreview')"><span class="switch-thumb"></span></button></div></div></div>`},
  settings:{title:'Настройки',content:`<div class="detail-list"><div class="card detail-card"><div class="detail-row"><div class="detail-copy"><strong>Тема приложения</strong><span>Светлая · адаптирована для жителей</span></div></div><div class="detail-row"><div class="detail-copy"><strong>Поддержка</strong><span>Связь с управляющей компанией и службой приложения</span></div><button class="action-sm secondary" onclick="showToast('Контакты поддержки показаны в полной версии')">Открыть</button></div><div class="detail-row"><div class="detail-copy"><strong>О приложении</strong><span>Презентационный UX-прототип жилого комплекса</span></div></div></div></div>`}
 };
 const view=views[section]||views.apartment;
 return subLayout(view.title, view.content);
}

function cameraClass(name){return name==='Холлы'?'entrance':name==='Дом'?'house':'yard'}
function camerasViewNoParking(){const list=['Двор','Дом','Холлы'];return subLayout('Камеры',`<div class="camera-hero card press" onclick="openCamera('Двор')"><div class="camera-scene yard"></div><div class="camera-overlay"><div class="camera-top"><span class="tag live">● LIVE</span><span class="mini">${nowTime()}</span></div><div class="camera-bottom"><strong>Двор</strong>${icon('camera')}</div></div></div><div class="section camera-list-dark" style="color:#111">${list.slice(1).map(x=>`<button class="access-row card press" style="width:100%;text-align:left" onclick="openCamera('${x}')"><div class="icon-wrap">${icon('camera')}</div><div class="access-info"><strong>${x}</strong><span>Камера онлайн</span></div>${icon('chev','chev')}</button>`).join('')}</div>`)}
function openCamera(name){state.currentCamera=name;state.previous=state.route;state.route='camera';render()}

function cameraViewNoParking(){const list=['Двор','Дом','Холлы'];return subLayout(state.currentCamera,`<div class="camera-live card"><div class="camera-scene ${cameraClass(state.currentCamera)}"></div><div class="live-hud"><div class="live-hud-top"><span class="tag live">● LIVE</span><span id="camClock">${nowTime()}</span></div><div class="live-hud-bottom"><strong>${state.currentCamera}</strong><span class="mini">Камера онлайн</span></div></div></div><div class="camera-actions"><button class="camera-action" onclick="showToast('Кадр сохранён в демо')">Снимок</button><button class="camera-action" onclick="showToast('Звук включён')">Звук</button><button class="camera-action" onclick="showToast('Полный экран в приложении')">Во весь экран</button></div><div class="camera-list-dark">${list.filter(x=>x!==state.currentCamera).map(x=>`<button class="camera-item-dark" onclick="state.currentCamera='${x}';render()"><div><strong>${x}</strong><br><span>Онлайн</span></div>${icon('chev','chev')}</button>`).join('')}</div>`,{dark:true})}
function openAccess(id){if(state.access[id]==='loading')return;state.access[id]='loading';render();setTimeout(()=>{state.access[id]='done';render();setTimeout(()=>{state.access[id]='idle';render()},2400)},800)}

function guestModal(){showModal(`<div class="grabber"></div><h2>Гостевой доступ</h2><p>Пропуск сработает только в выбранный период.</p><div class="field"><label>Имя гостя</label><input id="guestName" value="Алексей" /></div><div class="field"><label>Срок действия</label><select id="guestDuration"><option>Сегодня до 23:00</option><option>2 часа</option><option>24 часа</option></select></div><div class="sheet-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="confirm" onclick="createGuest()">Создать пропуск</button></div>`)}
function createGuest(){const name=document.getElementById('guestName').value||'Гость';state.guest={name};showModal(`<div class="grabber"></div><div class="center"><div class="success-mark">${icon('check')}</div><h2>Пропуск создан</h2><p>${escapeHtml(name)} · сегодня до 23:00</p><div class="qr"></div><p>Покажите этот QR-код на входе. В реальном приложении пропуск можно отправить гостю.</p><button class="primary" onclick="closeModal()">Готово</button></div>`)}

function openPayment(amount,type){showModal(`<div class="grabber"></div><h2>Оплата</h2><p>${type==='bill'?'Квитанция за сентябрь':'Дополнительный домофонный ключ'}</p><div class="total-amount" style="font-size:28px;margin-top:10px">${amount.toLocaleString('ru-RU')} ₽</div><div class="field"><label>Способ оплаты</label><select id="paymentMethod"><option>Банковская карта</option><option>СБП</option></select></div><div class="sheet-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="confirm" onclick="processPayment(${amount},'${type}')">Оплатить</button></div>`)}
function processPayment(amount,type){showModal(`<div class="grabber"></div><div class="center"><div class="spinner"></div><h2>Оплачиваем…</h2><p>Проверяем демонстрационный платёж</p></div>`);setTimeout(()=>{if(type==='bill')state.billPaid=true;else state.service.stage=3;showModal(`<div class="grabber"></div><div class="center"><div class="success-mark">${icon('check')}</div><h2>Оплачено ✓</h2><p>${amount.toLocaleString('ru-RU')} ₽ · операция выполнена</p><button class="primary success" onclick="closeModal();render()">Готово</button></div>`);},1100)}

function openStatusModal(loading,success,done){showModal(`<div class="grabber"></div><div class="center"><div class="spinner"></div><h2>${loading}</h2><p>Это займёт несколько секунд</p></div>`);setTimeout(()=>{showModal(`<div class="grabber"></div><div class="center"><div class="success-mark">${icon('check')}</div><h2>${success}</h2><button class="primary success" onclick="finishStatus()">Готово</button></div>`);window.__statusDone=done},850)}
function finishStatus(){closeModal();if(window.__statusDone){const f=window.__statusDone;window.__statusDone=null;f()}}

function showModal(html){closeModal();const d=document.createElement('div');d.className='modal-backdrop';d.id='modal';d.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">${html}</div>`;d.onclick=closeModal;app.appendChild(d)}
function removeElement(el){if(el&&el.parentNode)el.parentNode.removeChild(el)}
function closeModal(){removeElement(document.getElementById('modal'))}
function showToast(text){removeElement(document.querySelector('.toast'));const t=document.createElement('div');t.className='toast';t.textContent=text;app.appendChild(t);setTimeout(()=>removeElement(t),1800)}
function clearTransient(){removeElement(document.querySelector('.toast'))}

function simulateCall(){closeModal();const c=document.createElement('div');c.className='call';c.id='call';c.innerHTML=`<div class="call-video"></div><div class="call-content"><div class="call-head"><div class="tiny">Домофон · входящий видеозвонок</div><h2>Входная группа</h2><p id="callSub">Подъезд №1 · посетитель у двери</p></div><div class="call-spacer"></div><div class="call-status" id="callStatus"></div><div class="call-actions"><button class="call-btn" onclick="declineCall()"><span class="call-circle red">${icon('x')}</span><span>Отклонить</span></button><button class="call-btn" onclick="answerCall()"><span class="call-circle green">${icon('phone')}</span><span>Ответить</span></button><button class="call-btn" onclick="openFromCall()"><span class="call-circle blue">${icon('door')}</span><span>Открыть дверь</span></button></div></div>`;app.appendChild(c)}
function answerCall(){document.getElementById('callStatus').textContent='Соединено · 00:03';document.getElementById('callSub').textContent='Разговор с посетителем'}
function openFromCall(){const st=document.getElementById('callStatus');st.textContent='Открываем дверь…';setTimeout(()=>{st.textContent='Дверь открыта ✓';setTimeout(()=>removeElement(document.getElementById('call')),1400)},700)}
function declineCall(){removeElement(document.getElementById('call'));showToast('Звонок завершён')}

function resetDemo(){state=initialState();render();showToast('Демо сброшено')}
function nowTime(){return new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

setInterval(()=>{const t=nowTime();const st=document.getElementById('statusTime');if(st)st.textContent=t;const ch=document.getElementById('cameraTimeHome');if(ch)ch.textContent=t;const cc=document.getElementById('camClock');if(cc)cc.textContent=t},1000);

const phone=document.getElementById('phone');
const wrap=document.getElementById('phoneWrap');
phone.style.transform='none';
wrap.addEventListener('mouseleave',()=>phone.style.transform='none');

try{render()}catch(error){
  if(window.console&&window.console.error)window.console.error(error);
  app.innerHTML='<div class="startup-fallback"><div class="startup-fallback-card"><h1>Не удалось открыть приложение</h1><p>Попробуйте открыть этот файл в Safari или Chrome, а не в предпросмотре мессенджера или файлового менеджера.</p></div></div>';
}
</script>
</body>
</html>
